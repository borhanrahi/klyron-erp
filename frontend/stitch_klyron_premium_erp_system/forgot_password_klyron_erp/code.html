        /* Subtle atmospheric background glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle at center, rgba(79, 70, 229, 0.08) 0%, rgba(11, 19, 38, 0) 70%);

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden relative">
<div class="ambient-glow"></div>
<main class="w-full max-w-md relative z-10">
<div class="bg-surface/90 backdrop-blur-xl border border-outline-variant/30 rounded-2xl shadow-2xl p-stack-xl flex flex-col items-center">
<div class="text-center w-full mb-stack-lg">
<div class="font-headline-md text-headline-md font-bold text-primary mb-stack-md flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">widgets</span>
                    Klyron ERP
                </div>
<h1 class="font-title-lg text-title-lg text-on-surface mb-stack-xs">Forgot Password</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[300px] mx-auto leading-relaxed">
                    Enter the email address associated with your account and we'll send you a link to reset your password.
                </p>
</div>
<form class="w-full flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-stack-xs w-full">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-1" for="email">Work Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors text-[20px]">mail</span>
<input class="w-full bg-surface-container border border-outline-variant/40 rounded-lg py-2.5 pl-10 pr-4 font-body-md text-on-surface placeholder:text-outline/50 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none shadow-inner" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="w-full mt-stack-sm bg-primary-container text-on-primary-container font-label-md text-label-md py-3 rounded-lg hover:bg-primary hover:text-on-primary transition-all shadow-md hover:shadow-lg active:scale-[0.98] duration-200 flex items-center justify-center gap-2 border-t border-white/20" type="submit">
<span class="font-bold">Send Reset Link</span>
<span class="material-symbols-outlined text-[18px]">arrow_right_alt</span>
</button>
</form>
<div class="w-full mt-stack-lg pt-stack-md border-t border-outline-variant/20 flex justify-center">
<a class="inline-flex items-center gap-1.5 font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    Return to Login
                </a>
</div>
</div>
<div class="mt-stack-lg text-center">
<p class="font-label-sm text-label-sm text-outline">
                Need help? Contact your system administrator or <a class="text-primary hover:underline" href="#">IT Support</a>.
            </p>
</div>
