<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Klyron ERP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#e2dfff",
                        "on-tertiary-fixed": "#002113",
                        "surface-container": "#171f33",
                        "on-primary": "#1d00a5",
                        "on-secondary-container": "#00424e",
                        "inverse-surface": "#dae2fd",
                        "surface-container-highest": "#2d3449",
                        "secondary-fixed-dim": "#4cd7f6",
                        "primary-container": "#4f46e5",
                        "surface-dim": "#0b1326",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-tertiary-fixed-variant": "#005236",
                        "outline-variant": "#464555",
                        "on-surface-variant": "#c7c4d8",
                        "error-container": "#93000a",
                        "surface-container-low": "#131b2e",
                        "surface-container-high": "#222a3d",
                        "secondary": "#4cd7f6",
                        "surface-container-lowest": "#060e20",
                        "secondary-container": "#03b5d3",
                        "on-background": "#dae2fd",
                        "inverse-on-surface": "#283044",
                        "on-tertiary": "#003824",
                        "on-secondary-fixed": "#001f26",
                        "tertiary-fixed-dim": "#4edea3",
                        "surface-variant": "#2d3449",
                        "inverse-primary": "#4d44e3",
                        "secondary-fixed": "#acedff",
                        "on-error-container": "#ffdad6",
                        "on-surface": "#dae2fd",
                        "on-primary-fixed-variant": "#3323cc",
                        "tertiary": "#4edea3",
                        "on-tertiary-container": "#67f4b7",
                        "on-error": "#690005",
                        "primary": "#c3c0ff",
                        "surface": "#0b1326",
                        "on-secondary-fixed-variant": "#004e5c",
                        "on-primary-fixed": "#0f0069",
                        "tertiary-fixed": "#6ffbbe",
                        "outline": "#918fa1",
                        "error": "#ffb4ab",
                        "on-primary-container": "#dad7ff",
                        "surface-tint": "#c3c0ff",
                        "tertiary-container": "#006e4b",
                        "surface-bright": "#31394d",
                        "on-secondary": "#003640",
                        "background": "#0b1326"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "stack-xl": "48px",
                        "margin-desktop": "32px",
                        "gutter": "24px",
                        "stack-lg": "24px",
                        "base": "4px",
                        "container-max": "1440px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-xs": "4px"
                    },
                    "fontFamily": {
                        "title-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "12px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .glass-panel {
            background: theme('colors.surface-container-low');
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(70, 69, 85, 0.3);
        }

        .input-glow:focus-within {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
            border-color: theme('colors.primary-container');
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden relative bg-surface">
<!-- Abstract Background Elements -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/10 blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-container/5 blur-[100px]"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-[480px] z-10">
<!-- Brand Header -->
<div class="text-center mb-stack-xl">
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-xs tracking-tight">Klyron <span class="text-primary-container">ERP</span></h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Enterprise Resource Planning</p>
</div>
<!-- Registration Card -->
<div class="glass-panel rounded-2xl p-stack-xl shadow-lg relative overflow-hidden bg-surface-container-low">
<!-- Subtle top highlight -->
<div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-primary-container/50 to-transparent"></div>
<div class="mb-stack-lg text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-xs">Create your account</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Start your 14-day free trial. No credit card required.</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-stack-xs uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative group input-glow rounded-lg transition-all duration-200 bg-surface-container border border-outline-variant/50">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="person">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-transparent border-none text-on-surface font-body-md text-body-md focus:ring-0 placeholder:text-outline/50" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Work Email -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-stack-xs uppercase tracking-wider" for="email">Work Email</label>
<div class="relative group input-glow rounded-lg transition-all duration-200 bg-surface-container border border-outline-variant/50">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-transparent border-none text-on-surface font-body-md text-body-md focus:ring-0 placeholder:text-outline/50" id="email" name="email" placeholder="jane@company.com" required="" type="email"/>
</div>
</div>
<!-- Company Name -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-stack-xs uppercase tracking-wider" for="company">Company Name</label>
<div class="relative group input-glow rounded-lg transition-all duration-200 bg-surface-container border border-outline-variant/50">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="domain">domain</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-transparent border-none text-on-surface font-body-md text-body-md focus:ring-0 placeholder:text-outline/50" id="company" name="company" placeholder="Acme Corp" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-stack-xs uppercase tracking-wider" for="password">Password</label>
<div class="relative group input-glow rounded-lg transition-all duration-200 bg-surface-container border border-outline-variant/50">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-transparent border-none text-on-surface font-body-md text-body-md focus:ring-0 placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start pt-stack-xs">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant bg-surface-container text-primary-container focus:ring-primary-container focus:ring-2 focus:ring-offset-background" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                            I agree to the <a class="text-primary-fixed-dim hover:text-primary transition-colors underline decoration-primary-fixed-dim/30 underline-offset-4" href="#">Terms of Service</a> and <a class="text-primary-fixed-dim hover:text-primary transition-colors underline decoration-primary-fixed-dim/30 underline-offset-4" href="#">Privacy Policy</a>.
                        </label>
</div>
</div>
<!-- Submit Action -->
<div class="pt-stack-md">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-white bg-primary-container hover:bg-primary-container/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container focus:ring-offset-background transition-all duration-200 relative overflow-hidden group" type="submit">
<div class="absolute inset-0 w-full h-full bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>
                        Start 14-day Free Trial
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-stack-lg relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center">
<span class="px-2 text-outline font-label-sm text-label-sm uppercase tracking-wider glass-panel border-none bg-surface-container-low">
                        Or continue with
                    </span>
</div>
</div>
<!-- SSO Options -->
<div class="mt-stack-lg grid grid-cols-2 gap-stack-sm">
<button class="flex justify-center items-center py-2.5 px-4 border border-outline-variant/50 rounded-lg bg-surface-container-highest/30 hover:bg-surface-container-highest/60 transition-colors font-label-md text-label-md text-on-surface" type="button">
                    Google
                </button>
<button class="flex justify-center items-center py-2.5 px-4 border border-outline-variant/50 rounded-lg bg-surface-container-highest/30 hover:bg-surface-container-highest/60 transition-colors font-label-md text-label-md text-on-surface" type="button">
                    Microsoft
                </button>
</div>
</div>
<!-- Footer Link -->
<p class="mt-stack-lg text-center font-body-sm text-body-sm text-on-surface-variant">
            Already have an account? <a class="font-label-md text-label-md text-primary-fixed-dim hover:text-primary transition-colors" href="#">Log in here</a>
</p>
</main>
</body></html>
